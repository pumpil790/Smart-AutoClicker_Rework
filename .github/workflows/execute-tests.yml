name: 'Execute tests'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  tests:
    name: Run local unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Native C++ OCR unit tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            core/smart/detection/src/main/cpp/detector/matching/text/text_matching_core.cpp \
            core/smart/detection/src/main/cpp/detector/matching/text/recognition/text_tiling_utils.cpp \
            core/smart/detection/src/test/cpp/text_ocr_v3_tests.cpp \
            -o /tmp/text_ocr_v3_tests
          /tmp/text_ocr_v3_tests
      - name: Local unit tests with Gradle
        run: ./gradlew testFDroidDebugUnitTest
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      - name: Upload tests results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: ./**/testFDroidDebugUnitTest/TEST-*.xml
