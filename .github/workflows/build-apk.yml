name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build fDroid Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: set NDK
        shell: bash
        run: |
          set -x
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build Debug APK with Gradle
        run: ./gradlew -PabiFilters=arm64-v8a assembleFDroidDebug
        env:
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartautoclicker-arm64-v8a-debug-apk
          path: smartautoclicker/build/outputs/apk/fDroid/debug/*arm64-v8a*.apk

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls smartautoclicker/build/outputs/apk/fDroid/debug/*arm64-v8a*.apk | head -n 1)
          RELEASE_APK="Klick_r-Rework-arm64-v8a.apk"
          cp "$APK_PATH" "$RELEASE_APK"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TITLE="Klick'r Rework ${TAG_NAME} (arm64-v8a)"
          else
            TAG_NAME="latest"
            RELEASE_TITLE="Klick'r Rework Latest (arm64-v8a)"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$RELEASE_APK" --clobber
            gh release edit "$TAG_NAME" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --latest
          else
            gh release create "$TAG_NAME" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Сборка Klick'r Rework для Poco X3 Pro (arm64-v8a), без рекламы/биллинга, с отдельным Swipe on condition, улучшенным OCR и поддержкой строковых переменных и .txt-списков." \
              --latest
          fi


